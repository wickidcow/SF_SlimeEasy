# ============================================================
#  SlimeEasy Configuration
# ============================================================
# Notes:
#  - Time units are documented per setting: seconds use wall-clock time;
#    ticks use Slimefun/Bukkit scheduler ticks.
#  - enabled:        feature toggle. false = do not register the content
#                    (server restart required).
#  - research-level: experience level required to unlock the research
#                    (server restart required).
#  - Other values:   read at runtime and applied after /se reload.
#
# Reload with /se reload in game.
#  - Runtime values (damage/range/cooldowns/intervals/output/throughput/limits)
#    apply immediately.
#  - Feature toggles / research levels / registered item text require restart.
#
# Player-visible text is stored in lang/<language>.yml. Color codes use &.
# ============================================================

# Language file name, corresponding to plugins/SlimeEasy/lang/<language>.yml.
language: en_US

# ---------- Shared machine settings (Breaker / Placer frequency controls) ----------
machine:
  frequency:
    # Default interval used by the item-frame/lever frequency control (Slimefun ticks).
    default-interval: 1
    # Tick step added for each lever rotation position.
    step-per-angle: 3

# ---------- Auto Breaker ----------
auto-breaker:
  enabled: true
  research-level: 10

# ---------- Auto Placer ----------
auto-placer:
  enabled: true
  research-level: 10

# ---------- Sieves ----------
sieve:
  enabled: true
  research-level: 8
  reinforced-research-level: 16
  processing:
    minimum-action-interval-ticks: -1
    action-multiplier: 1.5
    scaffolding-speed-multiplier: 1.5
    max-linked-sieves: 100
    required-actions:
      dirt: 4
      grass-block: 6
      gravel: 8
      dust: 8
      crushed-netherrack: 12
      soul-sand: 7
      soul-soil: 11
      sand: 6
      crushed-end-stone: 20
      crushed-blackstone: 16

  # Reinforced Sieves use the full base chances below. Basic Sieves reduce
  # normal chances and some guaranteed reward amounts.
  rewards:
    basic:
      chance-multiplier: 0.5
      guaranteed-amount-multiplier: 0.5
      # Bamboo is a Basic Sieve progression reward and can be used to craft
      # the scaffolding required by the Reinforced Sieve structure.
      chance-overrides:
        dirt:
          bamboo: 8
        grass-block:
          bamboo: 16

  # Sieve input is shown using BlockDisplay. Width/depth shrink from 0.8 to 0.64
  # while height compresses from 0.8 to 0. The display remains centered on the
  # trapdoor surface and uses client interpolation rather than per-tick movement.
  animation:
    enabled: true
    interpolation-ticks: 3
    completion-ticks: 5
    start-horizontal-scale: 0.8
    end-horizontal-scale: 0.64
    start-height-scale: 0.8

  # Base chances for the Reinforced Sieve. Basic Sieves apply the multiplier above.
  # Each entry is rolled independently from 0-100. /se reload applies changes.
  chances:
    dirt:
      # Wheat Seeds
      wheat-seeds: 7
      # Short Grass
      short-grass: 7
      # Melon Seeds
      melon-seeds: 3
      # Pumpkin Seeds
      pumpkin-seeds: 3
      # Sugar Cane
      sugar-cane: 3
      # Carrot
      carrot: 2
      # Potato
      potato: 2
      # Oak Sapling
      oak-sapling: 2
      # Acacia Sapling
      acacia-sapling: 1
      # Spruce Sapling
      spruce-sapling: 1
      # Birch Sapling
      birch-sapling: 1
      # Bamboo; Basic Sieves use the higher chance override above.
      bamboo: 2
    grass-block:
      wheat-seeds: 14
      short-grass: 14
      melon-seeds: 6
      pumpkin-seeds: 6
      sugar-cane: 6
      carrot: 4
      potato: 4
      oak-sapling: 4
      acacia-sapling: 2
      spruce-sapling: 2
      birch-sapling: 2
      bamboo: 4
    gravel:
      # Flint
      flint: 25
      # Coal
      coal: 13
      # Lapis Lazuli
      lapis-lazuli: 5
      # Diamond
      diamond: 1
      # Emerald
      emerald: 1
      # Raw Iron
      raw-iron: 20
      # Raw Gold
      raw-gold: 3
      # Raw Copper
      raw-copper: 6
      # Slimefun Tin Dust
      tin-dust: 6
      # Slimefun Aluminum Dust
      aluminum-dust: 13
    dust:
      # Bone Meal
      bone-meal: 20
      # Redstone
      redstone: 13
      # Gunpowder
      gunpowder: 7
      # Glowstone Dust
      glowstone-dust: 6
      # Blaze Powder
      blaze-powder: 5
      # Slimefun Iron Dust
      iron-dust: 20
      # Slimefun Gold Dust
      gold-dust: 3
      # Slimefun Copper Dust
      copper-dust: 6
      # Slimefun Tin Dust
      tin-dust: 7
      # Slimefun Aluminum Dust
      aluminum-dust: 13
    crushed-netherrack:
      # Raw Iron
      raw-iron: 17
      # Raw Gold
      raw-gold: 17
      # Raw Copper
      raw-copper: 10
    soul-sand:
      # Nether Wart
      nether-wart: 5
      # Ghast Tear
      ghast-tear: 2
      # Extra Nether Quartz (the guaranteed 1 quartz is unaffected)
      extra-quartz: 33
    soul-soil:
      # Nether Wart
      nether-wart: 5
      # Ghast Tear
      ghast-tear: 2
      # Extra Nether Quartz (the guaranteed 1 quartz is unaffected)
      extra-quartz: 33
    sand:
      # Cocoa Beans
      cocoa-beans: 3
      # Cactus
      cactus: 3
      # Jungle Sapling
      jungle-sapling: 2
      # Brown Mushroom
      brown-mushroom: 1
      # Raw Iron
      raw-iron: 20
      # Raw Gold
      raw-gold: 3
      # Raw Copper
      raw-copper: 6
      # Slimefun Tin Dust
      tin-dust: 6
      # Slimefun Aluminum Dust
      aluminum-dust: 13
    crushed-end-stone:
      # Slimefun Tin Dust
      tin-dust: 10
      # Ender Pearl
      ender-pearl: 5
      # Chorus Fruit
      chorus-fruit: 8
      # Popped Chorus Fruit
      popped-chorus-fruit: 4
      # Shulker Shell
      shulker-shell: 1
    crushed-blackstone:
      # Basalt
      basalt: 20
      # Nether Quartz
      quartz: 15
      # Gold Nugget
      gold-nugget: 12
      # Magma Cream
      magma-cream: 5
      # Glowstone Dust
      glowstone-dust: 6
      # Blaze Powder
      blaze-powder: 4
      # Crying Obsidian
      crying-obsidian: 2
      # Ancient Debris
      ancient-debris: 1

# ---------- Creeper Ward ----------
creeper-ward:
  enabled: true
  research-level: 10
  # Protection radius in chunks: 1 = a 3x3 area centered on the ward's chunk.
  protect-radius-chunks: 1
  # Radius in blocks used to find creepers that should be pushed away.
  detect-radius: 48.0
  # Horizontal push strength.
  push-strength: 0.8
  # Additional upward push component.
  push-up: 0.2
  # Maximum number of creepers pushed in one tick.
  max-push-attempts: 20
  # Protected-chunk cache TTL in seconds.
  protection-ttl-seconds: 8
  # Maximum chunks scanned backward from a natural spawn event.
  max-scan-chunks: 16

# ---------- Butcher Machine ----------
butcher:
  enabled: true
  research-level: 15
  # Base attack cross-section width/height in blocks; each Range level adds 2.
  base-span: 3
  # Base attack depth in blocks; each Range level adds 1.
  base-depth: 1
  # Linear damage increase per Damage Upgrade level, as a fraction of base damage.
  damage-per-level: 0.5
  # Number of attacks granted by one nutrition point.
  attacks-per-nutrition: 15
  # Maximum internal nutrition cache.
  max-satiety: 100
  # Maximum Range / Damage Upgrade level.
  max-upgrade-level: 5

# ---------- Auto Clicker ----------
auto-clicker:
  enabled: true
  research-level: 15
  # Minimum click interval in ticks; 0.05 = up to 20 clicks per tick.
  min-interval: 0.05
  # Maximum click interval in ticks.
  max-interval: 40.0
  # Default click interval in ticks.
  default-interval: 4.0
  # Fine adjustment step used by Shift-click, in ticks.
  fine-step: 0.05
  # Coarse adjustment step used by normal click, in ticks.
  coarse-step: 0.25
  # Maximum clicks in a single Slimefun tick to prevent runaway work.
  max-clicks-per-tick: 20
  # Maximum number of items refilled into the held-item slot per tick when
  # an Extraction Upgrade is installed.
  extract-max-items-per-tick: 64

# ---------- Quarry (observer + cobblestone touching lava and water) ----------
quarry:
  enabled: true
  research-level: 12
  # Slimefun ticks between production cycles with no Efficiency Upgrade.
  base-interval-ticks: 2
  # Items produced per base production cycle.
  base-output: 1
  # Output per Slimefun tick for each Efficiency Upgrade tier.
  efficiency-output:
    tier-1: 1
    tier-2: 6
    tier-3: 12
    tier-4: 32
    tier-5: 64
  # If nearby containers cannot accept all output, drop leftovers at the
  # Quarry location when true; discard them when false.
  drop-overflow: false

# ---------- Ore Surveyor ----------
survey-ruler:
  enabled: true
  research-level: 10
  # Survey cooldown in ticks.
  cooldown-ticks: 100
  # Industrial Miner radius (7x7 -> 3).
  miner-range: 3
  # Advanced Industrial Miner radius (11x11 -> 5).
  advanced-miner-range: 5
  # Fuel estimates: mineable blocks per fuel unit.
  blocks-per-bucket: 96
  blocks-per-raw-fuel: 128
  blocks-per-fuel: 256

# ---------- Engineer Goggles ----------
engineer-goggles:
  enabled: true
  research-level: 12
  # 3D scan radius in the same world; scanning never force-loads chunks.
  radius: 16
  # Wear detection, machine information, and hologram refresh interval in ticks.
  refresh-ticks: 10
  # Maximum new 16x16x16 cells scanned per refresh. Lower values reduce spikes
  # but make newly entered areas appear more slowly.
  max-new-cells-per-refresh: 4

# ---------- Growth Inhibitor ----------
growth-inhibitor:
  enabled: true
  research-level: 10

# ---------- Combat Harness ----------
combat-harness:
  enabled: true
  research-level: 20
  # Magic damage dealt by each harness tier's Guardian beam.
  damage:
    tier-1: 5.0
    tier-2: 10.0
    tier-3: 20.0
    tier-4: 25.0
  # Engagement radius in blocks.
  range: 16.0
  # Minimum time between attacks in milliseconds.
  cooldown-millis: 1500
  # Target scan interval in ticks.
  period-ticks: 15

# ---------- Storage System ----------
storage:
  # Mass Storage Drawer
  drawer:
    enabled: true
    research-level: 8
    # Magnet radius in blocks.
    magnet-radius: 6.0
    # Number of internal item-type slots.
    slots: 32
  # Paged Storage Box
  box:
    enabled: true
    research-level: 15
    # Number of item types displayed per page.
    page-types: 45
    # Magnet radius in blocks.
    magnet-radius: 6.0
  # Disk Manager and Item Storage Disks
  disk:
    enabled: true
    research-level: 25
  # Storage Upgrade Components
  upgrade:
    enabled: true
    research-level: 20
    # Maximum upgrade slots.
    max-slots: 14
    # Maximum page count after Page Expansion upgrades.
    max-pages: 5
    # Maximum item types in extraction/output filters (GUI maximum 27).
    filter-max-items: 27
    # Whether newly created filters default to whitelist mode.
    # false = blacklist by default.
    filter-default-whitelist: false
  # Per-tick transfer limits for Extraction / Output upgrades and each active
  # network port. 0 = unlimited.
  io:
    pull-max-items-per-tick: 0
    push-max-items-per-tick: 0
  # Storage Network
  network:
    enabled: true
    research-level: 30
    # Network scan radius in blocks.
    scan-radius: 24
    # Maximum controllers bound to one Remote Terminal. 0 = unlimited.
    remote-terminal-max-bindings: 0

# ---------- Simple Villagers ----------
villager:
  # Villager Catcher
  catcher:
    enabled: true
    research-level: 12
  # Zombie Signal
  zombie-signal:
    enabled: true
    research-level: 8
  # Villager Trader
  trader:
    enabled: true
    research-level: 18
    # Restock interval in seconds when the villager's profession matches
    # the installed workstation block.
    restock-interval-seconds: 30
  # Capsule Iron Farm
  iron-farm:
    enabled: true
    research-level: 20
    # Iron production interval in seconds when Villager + Zombie Signal + Food
    # are all present.
    produce-interval-seconds: 20
    # Nutrition consumed per production cycle.
    food-per-cycle: 1
    # Iron ingots produced per cycle.
    iron-per-cycle: 1
    # Maximum Speed Upgrade level.
    speed-upgrade-max-level: 5
    # Speed scaling: actual interval = base interval / (1 + level x step).
    speed-upgrade-step: 0.5
  # Villager School
  school:
    enabled: true
    research-level: 15
    # Seconds required to convert a Nitwit into an unemployed villager.
    convert-seconds: 30
  # Potion of Forgetting
  forgetting-potion:
    enabled: true
    research-level: 12
  # Villager Healer
  healer:
    enabled: true
    research-level: 15
    # Seconds required to cure a Zombie Villager; consumes one regular Golden Apple.
    convert-seconds: 30

# ---------- Simple Territory ----------
territory:
  # Feature toggle and research level are frozen during Slimefun registration.
  # Restart the server after changing either value.
  enabled: true
  research-level: 8
