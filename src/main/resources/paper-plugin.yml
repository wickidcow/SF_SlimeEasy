name: SlimeEasy
version: '${version}'

main: top.maplex.slimeEasy.SlimeEasy
bootstrapper: top.maplex.slimeEasy.SlimeEasyBootstrap
loader: top.maplex.slimeEasy.SlimeEasyLoader
api-version: '26.2'
load: POSTWORLD

# Dependency declaration: Slimefun must load before SlimeEasy and expose its API on the classpath.
dependencies:
  server:
    Slimefun:
      load: BEFORE
      required: true
      join-classpath: true
    DecentHolograms:
      load: BEFORE
      required: false
      join-classpath: true
