  villager:
    name: "&bSimple Villagers"
    lore: |-

      &7Work with villagers without needing to protect physical villagers
  territory:
    name: "&6Simple Territory"
    lore: |-

      &7Chunk claims, member permissions, and Slimefun protection integration

