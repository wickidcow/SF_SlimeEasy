      lore: |-
        &7Click with an item on the cursor or click an inventory item
        &7to add/remove it from the filter
    listed-item-lore: |-
      &8Click to remove from the filter
    face:
      enabled:
        name: "&a{face} Face: Enabled"
        lore: |-
          &8Click to disable
      disabled:
        name: "&7{face} Face: Disabled"
        lore: |-
          &8Click to enable
    mode:
