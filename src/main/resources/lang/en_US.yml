        name: "&cBlacklist Mode"
        lore: |-
          &7Listed items are &cblocked&7; all others are allowed
          &8Click to switch to whitelist
      whitelist:
        name: "&aWhitelist Mode"
        lore: |-
          &7Only listed items are allowed; all others are blocked
          &8Click to switch to blacklist
  common:
