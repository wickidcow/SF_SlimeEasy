# SlimeEasy English (US) language file.
# Color codes use &; dynamic content uses {placeholder}.
# Items and UI use nested name/lore keys; lore uses YAML multiline blocks.

items:
  auto-breaker:
    name: "&eAuto Breaker"
    lore: |-

      &7Place a &fregular piston &7next to the machine and it will
      &7automatically break the block in front of the piston
      &7and collect the drops into this container.

      &7Place an item frame with a lever on the piston
      &7and rotate the lever to adjust the breaking interval.

      &7Put a tool in &fany slot &7to mine with that tool
      &7(including Fortune / Silk Touch). When it breaks,
      &7the machine uses another tool or falls back to hand mining.
  auto-placer:
    name: "&aAuto Placer"
    lore: |-

      &7Place a &fsticky piston &7next to the machine and it will
      &7automatically place blocks from this container into
      &7the empty space in front of the piston.

      &7Place an item frame with a lever on the piston
      &7and rotate the lever to adjust the placement interval.

      &7The first &fplaceable block &7in the container is used;
      &7the machine skips a cycle if the target is occupied or empty.
  sieve:
    name: "&6Basic Sieve"
    lore: |-

      &7Structure: place a wooden trapdoor on top of
      &7an upward-facing dispenser.
      &7Right-click the top trapdoor to advance sieving.

      &7By default, normal independent chances are halved,
      &7and the guaranteed stone reward is reduced from 2 to 1.
      &7Dirt and grass have a higher chance to yield bamboo,
      &7which can be used to craft scaffolding for the Reinforced Sieve.
  reinforced-sieve:
    name: "&eReinforced Sieve"
    lore: |-

      &7Structure: place scaffolding on an upward-facing dispenser,
      &7then place a wooden trapdoor on top of the scaffolding.

      &7Right-click the top trapdoor to advance sieving.
      &7Processes faster and uses the full base reward chances.
  sieve-materials:
    dust:
      name: "&fDust"
      lore: |-
        &7Made by grinding sand in a Grind Stone; can be sieved.
    crushed-netherrack:
      name: "&cCrushed Netherrack"
      lore: |-
        &7Made by grinding netherrack in a Grind Stone; can be sieved.
    crushed-end-stone:
      name: "&eCrushed End Stone"
      lore: |-
        &7Made by grinding end stone in a Grind Stone; can be sieved.
    crushed-blackstone:
      name: "&8Crushed Blackstone"
      lore: |-
        &7Made by grinding polished blackstone; can be sieved.
        &8Regular blackstone still follows Slimefun's normal gravel recipe.
  creeper-ward:
    name: "&aCreeper Ward"
    lore: |-

      &7When placed, the chunk it is in plus the surrounding ring
      &7(&f3x3 chunks &7by default) blocks natural creeper spawning.
      &7Creepers that enter the area are continuously pushed away
      &7and &ccannot explode &7while protected.

      &7Protection lasts while the block exists and ends when broken.
  survey-ruler:
    name: "&bOre Surveyor"
    lore: |-

      &7Right-click the ground to scan downward using the
      &fIndustrial Miner &7mining area (&f7x7&7), listing
      &7mineable ore types and quantities.

      &7Sneak + Left-click: switch display (&fChat &7/ &fInventory GUI&7)

      &7Cooldown: &f5 seconds
  advanced-survey-ruler:
    name: "&bAdvanced Ore Surveyor"
    lore: |-

      &7Right-click the ground to scan downward using the
      &fcurrently selected survey area&7, listing mineable ores.

      &7Sneak + Right-click air: switch between the
      &fAdvanced Industrial Miner &7(&f11x11&7) and
      &fIndustrial Miner &7(&f7x7&7) scan sizes.

      &7Sneak + Left-click: switch display (&fChat &7/ &fInventory GUI&7)

      &7Cooldown: &f5 seconds
  engineer-goggles:
    name: "&bEngineer Goggles"
    lore: |-

      &7Wear in the helmet slot to display nearby &fSlimefun blocks
      &7and multiblock structures with available energy information.

      &7Display radius: &f{radius} blocks
      &8Holograms are private and do not block interaction.

      &7Sneak + Left-click while held: &fOpen display filters
      &7Sneak + Right-click a machine: &fToggle that item type
      &7Filter menu mode: &fNearby / Aimed Target
  engineer-night-vision-goggles:
    name: "&aEngineer Night Vision Goggles"
    lore: |-

      &7Combines &fNight Vision Goggles &7with &fEngineer Goggles&7.
      &7Provides permanent night vision while worn and displays
      &7nearby machine diagnostics.

      &7Display radius: &f{radius} blocks
      &8Private holograms do not block clicks and cannot be seen by others.

      &7Sneak + Left-click while held: &fOpen display filters
      &7Sneak + Right-click a machine: &fToggle that item type
      &7Filter menu mode: &fNearby / Aimed Target
  butcher:
    name: "&cButcher Machine"
    lore: |-

      &7Automatically attacks non-player mobs in a
      &f3x3 area in front of the machine &7(area sweep).

      &7Right-click to open the menu:
      &7- &f7 weapons&7: first weapon has priority; switches when broken
      &7- &fEnchanted books&7: Looting / Sharpness / Fire Aspect apply
      &7- &fFood&7: converted into attacks (15 attacks per nutrition point,
      &7  internal maximum of 100 nutrition)
      &7- &fUpgrade slots&7: range / damage components (up to level 5)

      &7All items can be supplied through &fCargo &7or &fhoppers&7.
      &7Kills drop normal loot and XP; the machine will not operate
      &7inside territory where its owner lacks permission.
  butcher-range-upgrade:
    name: "&dButcher - Range Upgrade"
    lore: |-

      &7Place in the Butcher Machine's range upgrade slot.
      &7Each upgrade: attack width/height &f+2 blocks&7,
      &7attack depth &f+1 block&7.
      &7(3x3 -> 5x5 -> 7x7 ... based on stack size)
  butcher-damage-upgrade:
    name: "&cButcher - Damage Upgrade"
    lore: |-

      &7Place in the Butcher Machine's damage upgrade slot.
      &7Each upgrade adds &f+50% base damage&7.
      &7(x1.5 -> x2.0 -> x2.5 ... based on stack size)
  auto-clicker:
    name: "&6Auto Clicker"
    lore: |-

      &7Uses a fake player to repeatedly &fleft / right click &7the block
      &7directly in front of the machine.

      &cRequires redstone power&7: powered = running, unpowered = stopped.
      &7Right-click to place &fone held item&7 used by the fake player
      &7(e.g. bone meal / buckets / seeds); consumed items are written back.
      &7The slot can be refilled by an &fadjacent hopper &7or Cargo.
      &7Install an &fExtraction Upgrade &7to refill from adjacent containers
      &7with blacklist / whitelist filtering.

      &7Supports &fSlimefun block interaction &7and can
      &fbypass research unlock checks &7for machine interaction.
      &8Default rate is about once per second.
  growth-inhibitor:
    name: "&aGrowth Inhibitor"
    lore: |-

      &7Right-click a &fbaby mob &7to lock its age,
      &7keeping it &fyoung permanently&7.

      &7Right-click an &falready locked &7mob again to unlock it
      &7and resume normal growth.
      &8(Only works on breedable mobs such as animals and villagers.)
  combat-harness:
    tier-1:
      name: "&bCombat Harness I"
      lore: |-

        &7Right-click a &fHappy Ghast &7to equip it.
        &7While worn, the Happy Ghast uses a &bGuardian beam &7to attack
        &7hostile mobs in &fline of sight &7(&ccannot shoot through blocks&7).

        &7Each beam deals &c{damage} damage &7as &dmagic damage,
        &7ignoring armor.
    tier-2:
      name: "&aCombat Harness II"
      lore: |-

        &7Right-click a &fHappy Ghast &7to equip it.
        &7While worn, the Happy Ghast uses a &bGuardian beam &7to attack
        &7hostile mobs in &fline of sight &7(&ccannot shoot through blocks&7).

        &7Each beam deals &c{damage} damage &7as &dmagic damage,
        &7ignoring armor.
    tier-3:
      name: "&6Combat Harness III"
      lore: |-

        &7Right-click a &fHappy Ghast &7to equip it.
        &7While worn, the Happy Ghast uses a &bGuardian beam &7to attack
        &7hostile mobs in &fline of sight &7(&ccannot shoot through blocks&7).

        &7Each beam deals &c{damage} damage &7as &dmagic damage,
        &7ignoring armor.
    tier-4:
      name: "&cCombat Harness IV"
      lore: |-

        &7Right-click a &fHappy Ghast &7to equip it.
        &7While worn, the Happy Ghast uses a &bGuardian beam &7to attack
        &7hostile mobs in &fline of sight &7(&ccannot shoot through blocks&7).

        &7Each beam deals &c{damage} damage &7as &dmagic damage,
        &7ignoring armor.
  quarry:
    name: "&bQuarry"
    lore: |-

      &7Observer-based machine. If the &fcobblestone in front &7is
      &7adjacent to both &clava &7and &9water &7(they need not be sources),
      &7the Quarry continuously generates material without breaking it.

      &7The Quarry has &fno internal output inventory&7; products are sent
      &7directly to nearby &fcontainers / drawers / paged boxes&7.

      &7Right-click to install &fEfficiency Upgrades I-V&7.
      &7An empty slot uses the base rate; each tier increases output.
      &7Install a &cNetherrack&7, &eEnd Stone&7, or &8Blackstone Upgrade
      &7to change the generated material.
  quarry-efficiency:
    tier-1:
      name: "&fQuarry Efficiency Upgrade I"
      lore: |-

        &7Place in the Quarry's &fEfficiency Upgrade slot&7.
        &7Production rate depends on tier and server configuration.
        &8(Stack size does not increase the tier.)
    tier-2:
      name: "&aQuarry Efficiency Upgrade II"
      lore: |-

        &7Place in the Quarry's &fEfficiency Upgrade slot&7.
        &7Production rate depends on tier and server configuration.
        &8(Stack size does not increase the tier.)
    tier-3:
      name: "&eQuarry Efficiency Upgrade III"
      lore: |-

        &7Place in the Quarry's &fEfficiency Upgrade slot&7.
        &7Production rate depends on tier and server configuration.
        &8(Stack size does not increase the tier.)
    tier-4:
      name: "&bQuarry Efficiency Upgrade IV"
      lore: |-

        &7Place in the Quarry's &fEfficiency Upgrade slot&7.
        &7Production rate depends on tier and server configuration.
        &8(Stack size does not increase the tier.)
    tier-5:
      name: "&6Quarry Efficiency Upgrade V"
      lore: |-

        &7Place in the Quarry's &fEfficiency Upgrade slot&7.
        &7Production rate depends on tier and server configuration.
        &8(Stack size does not increase the tier.)
  quarry-output:
    netherrack:
      name: "&cQuarry Netherrack Upgrade"
      lore: |-

        &7Place in the Quarry's &fOutput Upgrade slot&7.
        &7Changes Quarry output from cobblestone to &cnetherrack&7.
        &8The cobblestone/lava/water structure remains unchanged.
    end-stone:
      name: "&eQuarry End Stone Upgrade"
      lore: |-

        &7Place in the Quarry's &fOutput Upgrade slot&7.
        &7Changes Quarry output from cobblestone to &eend stone&7.
        &8The cobblestone/lava/water structure remains unchanged.
    blackstone:
      name: "&8Quarry Blackstone Upgrade"
      lore: |-

        &7Place in the Quarry's &fOutput Upgrade slot&7.
        &7Changes Quarry output from cobblestone to &8blackstone&7.
        &8More expensive to craft; the generation structure is unchanged.
  storage:
    drawer:
      name: "&eMass Storage Drawer"
      lore: |-

        &7Stores a &fsingle item type &7in quantities far beyond vanilla stacks.
      
        &7An invisible display on the front shows the item.
        &7Aim at it to see the stored amount.

        &7Right-click display: store held stack; &fdouble-click &7stores all matching items.
        &7Left-click display: withdraw one; &fShift + Left-click &7withdraws a stack.
        &fRight-click the barrel &7to open controls and upgrades.

        &7Compatible with Slimefun Cargo.
    paged-box:
      name: "&6Paged Storage Box"
      lore: |-

        &7Stores &fmultiple item types &7(one type per slot/page entry)
        &7with quantities far beyond vanilla stack limits.

        &7Right-click to open the paged inventory. Click stored items to
        &7withdraw and click player inventory items to deposit.
        &7Upgrades are managed from the same GUI.

        &7Compatible with Slimefun Cargo.
    disk-manager:
      name: "&dDisk Manager"
      lore: |-

        &7Uses the six vanilla chiseled-bookshelf slots to install
        &7Item Storage Disks, which are displayed directly in the block.

        &7Right-click to view disk status and install/remove disks.
        &7When connected to a Storage Network, disk contents can be
        &7accessed through the network terminal.
    disks:
      1k:
        name: "&f1K Item Storage Disk"
        lore: |-
          &7Capacity: &f1,024 bytes
          &7Maximum item types: &f64
      4k:
        name: "&a4K Item Storage Disk"
        lore: |-
          &7Capacity: &f4,096 bytes
          &7Maximum item types: &f64
      16k:
        name: "&b16K Item Storage Disk"
        lore: |-
          &7Capacity: &f16,384 bytes
          &7Maximum item types: &f64
      64k:
        name: "&d64K Item Storage Disk"
        lore: |-
          &7Capacity: &f65,536 bytes
          &7Maximum item types: &f64
      128k:
        name: "&6128K Item Storage Disk"
        lore: |-
          &7Capacity: &f131,072 bytes
          &7Maximum item types: &f64
      256k:
        name: "&c256K Item Storage Disk"
        lore: |-
          &7Capacity: &f262,144 bytes
          &7Maximum item types: &f64
      status-lore: |-
        &7Item types: &f{types}&7/{maxTypes}
        &7Total items: &f{items}
        &7Bytes used: &f{used}&7/{capacity}

        &8Non-empty disks cannot be stored inside another disk.
    network:
      controller:
        name: "&bNetwork Controller"
        lore: |-

          &7The brain and access point of a Storage Network.
          &7Right-click to open the &fNetwork Terminal&7 and access
          &7all connected drawers, storage boxes, and disks.

          &7Each tick it routes input/output ports and bridges Cargo.
          &7Network radius is controlled by server configuration.
      connector:
        name: "&7Network Connector"
        lore: |-

          &7Network cable used to connect controllers, storage blocks,
          &7and ports. Adjacent placement connects automatically.
      input-port:
        name: "&aNetwork Input Port"
        lore: |-

          &7Items inserted by Cargo or players are &fdistributed into
          &7the network &7according to member priority.

          &7Must be connected to a network containing a controller.
      output-port:
        name: "&cNetwork Output Port"
        lore: |-

          &7Provides network items for players or Cargo to withdraw.

          &7Must be connected to a network containing a controller.
    remote-terminal:
      name: "&dRemote Terminal"
      lore: |-

        &7Right-click a &fNetwork Controller &7while holding this item to bind it.
        &7Right-click anywhere to remotely open the selected network terminal.
        &7Use the button left of Next Page to cycle bound controllers.
        &7Shift + Right-click to manage all bindings.

        &7Binding data is stored on the item itself.
    upgrades:
      stack-1:
        name: "&fStack Upgrade I"
        lore: |-

          &7Per-slot capacity &fx4

          &8[Storage Upgrade Component]
      stack-2:
        name: "&eStack Upgrade II"
        lore: |-

          &7Per-slot capacity &fx16

          &8[Storage Upgrade Component]
      stack-3:
        name: "&6Stack Upgrade III"
        lore: |-

          &7Per-slot capacity &fx64

          &8[Storage Upgrade Component]
      experience:
        name: "&aExperience Storage Upgrade"
        lore: |-

          &7Converts a drawer/box into &fexperience storage&7
          &7and disables item Cargo for that container.

          &8[Storage Upgrade Component]
      magnet:
        name: "&bMagnet Upgrade"
        lore: |-

          &7Pulls nearby dropped items / experience orbs into the container.

          &8[Storage Upgrade Component]
      void:
        name: "&8Void Upgrade"
        lore: |-

          &7Items matching the void list are capped at the configured
          &fkeep amount&7; excess items are &cdestroyed &7before storage.
          &7Configure the list and keep amount in the upgrade GUI.

          &8[Storage Upgrade Component]
      page:
        name: "&dPage Expansion"
        lore: |-

          &7Adds &f1 page &7to a &fPaged Storage Box&7.
          &7Can be stacked up to the configured maximum.
          &8(Does not work on drawers.)

          &8[Storage Upgrade Component]
      wise:
        name: "&aWise Upgrade"
        lore: |-

          &7When an experience container absorbs XP,
          &7there is a &f20% &7chance to double that XP.
          &8(Requires Experience + Magnet upgrades.)

          &8[Storage Upgrade Component]
      ender-wise:
        name: "&5Ender Wise Upgrade"
        lore: |-

          &7When an experience container absorbs XP,
          &7there is a &f50% &7chance to double that XP.
          &7Can stack with Wise Upgrade as an independent roll.
          &8(Requires Experience + Magnet upgrades.)

          &8[Storage Upgrade Component]
      extract:
        name: "&eExtraction Upgrade"
        lore: |-

          &7When installed in a container or Auto Clicker, actively pulls
          &7items from adjacent hoppers, chests, and SlimeEasy storage.
          &7Configure blacklist / whitelist rules and enabled faces in the GUI.
          &8(Disabled while the container is in experience mode.)

          &8[Storage Upgrade Component]
      remote:
        name: "&dRemote Upgrade"
        lore: |-

          &7Right-click a Network Controller while holding this upgrade
          &7to &fselect a target&7, then install it in a drawer/box.
          &7The storage block will &fremotely join &7that controller's network
          &7without requiring physical adjacency.

          &8[Storage Upgrade Component]
      output:
        name: "&eItem Output Upgrade"
        lore: |-

          &7Actively pushes stored items into adjacent containers each tick.
          &7Configure blacklist / whitelist rules and enabled faces in the GUI.
          &8(Disabled while the container is in experience mode.)

          &8[Storage Upgrade Component]
      compression:
        name: "&6Compression Upgrade"
        lore: |-

          &7Only works in a &fPaged Storage Box&7.
          &7Automatically applies matching &f2x2 &7compression recipes
          &7when stored quantities change.
          &7Includes a &f17-slot &7blacklist / whitelist filter.

          &8[Storage Upgrade Component]
      advanced-compression:
        name: "&cAdvanced Compression Upgrade"
        lore: |-

          &7Only works in a &fPaged Storage Box&7.
          &7Supports both &f2x2 and 3x3 &7compression recipes
          &7with a &f17-slot &7blacklist / whitelist filter.
          &7Can optionally allow irreversible recipes.

          &8[Storage Upgrade Component]
  villager:
    zombie-signal:
      name: "&2Zombie Signal"
      lore: |-

        &7A zombie-attracting signal crafted from rotten flesh and iron.
        &7Required catalyst for the Capsule Iron Farm; not consumed.
    catcher:
      name: "&aVillager Catcher"
      lore: |-

        &7Right-click a living villager to &fcapture it &7while preserving
        &7all of its attributes.
        &7Sneak + Right-click to &frelease &7the stored villager.

        &7An empty catcher is also used to craft villager machines.
    trader:
      name: "&bVillager Trader"
      lore: |-

        &7Transparent container with a miniature villager display.

        &7Right-click an empty block: insert a &fvillager (filled catcher)
        &7or &fworkstation block&7.
        &7Right-click with a villager installed: &fopen trading directly&7.
        &7Sneak + Right-click: &fremove &7the villager or workstation.

        &7If the villager profession matches its workstation, trades
        &7are &fautomatically restocked &7at the configured interval.
    iron-farm:
      name: "&fCapsule Iron Farm"
      lore: |-

        &7Transparent container displaying villagers and a zombie;
        &7an iron golem briefly appears when iron is produced.

        &7Right-click and supply:
        &7- &fVillager (filled catcher)&7 - &fZombie Signal&7 - &fFood&7 - &fSpeed Upgrade&7
        &7With villager + signal + food present, iron is produced on a timer.
        &7Each cycle consumes food; Speed Upgrades shorten the interval.
    iron-farm-speed-upgrade:
      name: "&eIron Farm - Speed Upgrade"
      lore: |-

        &7Place in the Capsule Iron Farm's speed upgrade slot.
        &7Stack size = level; higher levels shorten the production interval.
    school:
      name: "&6Villager School"
      lore: |-

        &7Insert a &fNitwit Villager (filled catcher)&7.
        &7After the configured time it becomes an &funemployed villager
        &7that can take a profession; the result goes to the output slot.
    healer:
      name: "&6Villager Healer"
      lore: |-

        &7Insert a &fZombie Villager (filled catcher) &7and a
        &fregular Golden Apple&7. After the configured time, the villager
        &7is cured while retaining its profession. One apple is consumed.
    forgetting-potion:
      name: "&dPotion of Forgetting"
      lore: |-

        &7Right-click a living villager to make it &fforget its profession&7
        &7and become an unemployed villager that can take a new job.
        &7Consumes one potion per use.
    filled-catcher:
      name: "Villager Catcher - {villager}"
      profession-lore: "&7Profession: &f{profession}"
      trade-lore: "&7Level: &f{level}  &7Trades: &f{trades}"
      release-lore: "&7Sneak + Right-click to release this villager"
  territory-core:
    name: "&6Territory Core"
    lore: |-

      &7Claims a 3x3 chunk area centered on the core when placed.
      &7Each player may own one territory.
      &7Right-click to open territory management.
  territory-flag:
    name: "&fTerritory Flag"
    lore: |-

      &7Claims a 3x3 chunk area centered on the flag.
      &7Coverage from flags in the same territory may overlap.
      &7Hold a flag to display nearby claimed borders.
      &7Maximum: 35 flags per territory.

groups:
  utility-machines:
    name: "&bUtility Machines"
    lore: |-

      &7Useful automation machines and devices
  utility-tools:
    name: "&bUtility Tools"
    lore: |-

      &7Useful handheld tools and utilities
  storage:
    name: "&bStorage System"
    lore: |-

