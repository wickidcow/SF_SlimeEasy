        &7Action permissions: &f{actions}/6
        &7Management permissions: &f{management}/{managementMax}
        &8Only affects members who join later
    settings:
      name: "&eTerritory Settings"
      lore: |-
        &7Configure visitor entry and existing flight abilities
    chunks:
      name: "&eChunk Management"
      lore: |-
        &7Current chunk count: &f{count}
    flag-editor:
      name: "&eFlag Editor"
      lore: |-
        &7Current pattern layers: &f{patterns}
        &7Updates all flags belonging to this territory
    flag-preview:
      name: "&fCurrent Territory Flag"
      lore: |-
        &7Pattern layers: &f{patterns}
        &8Preview includes base color and every pattern layer
        &aClick a banner in your inventory to import its appearance
        &8The template banner is not moved or consumed
    flag-clear:
      name: "&cClear Flag Pattern"
      lore: |-
        &7Reset all territory flags to a blank white banner
    transfer:
      name: "&dTransfer Territory"
      lore: |-
        &7Transfer ownership to an online member
        &cThe target cannot already own a territory
    disband:
      name: "&cDisband Territory"
      lore: |-
        &7Release all claimed chunks
        &cThis action cannot be undone
    add-member:
      name: "&aInvite Member"
      lore: |-
        &7Open the online player list
        &7Select a player and confirm the invitation
    no-invite-candidates:
      name: "&7No Eligible Players"
      lore: |-
        &7All online players are already members, hidden, or ineligible
    invite-player:
      name: "&f{player}"
      lore: |-
        &7Click to select this online player
    invite-selected:
      name: "&f{player}"
      lore: |-
        &7This player is selected
        &7Click the confirmation button below to send the invite
    invite-confirm:
      name: "&aSend Territory Invite"
      lore: |-
        &7Target player: &f{player}
        &7They have 5 minutes to accept or decline
        &eClick to confirm
    back:
      name: "&fBack"
      lore: |-
        &7Return to the previous menu
    member-summary: "&7Action permissions: &f{actions}/6  &7Management: &f{management}/{managementMax}"
    permission:
      name: "&e{permission}"
      lore: |-
        &7Current state: {state}
        &7Click to toggle
    permission-readonly:
      name: "&e{permission}"
      lore: |-
        &7Current state: {state}
        &8View only
    management:
      name: "&b{permission}"
      lore: |-
        &7Current state: {state}
        &7Only the territory owner may toggle this
    management-readonly:
      name: "&b{permission}"
      lore: |-
        &7Current state: {state}
        &8View only
    remove-member:
      name: "&cRemove Member"
      lore: |-
        &7Open a confirmation menu to remove this member
    remove-confirm:
      name: "&cConfirm Removal: {player}"
      lore: |-
        &7Immediately revoke all territory permissions
        &cIf visitors cannot enter, the player will be moved outside
    setting:
      name: "&e{setting}"
      lore: |-
        &7Current state: {state}
        &7Click to toggle
    chunk:
      name: "&fChunk {x}, {z}"
      lore: |-
        &7The core and every flag claim must remain connected
    expansion-mode:
      name: "&aSelect This Territory for Expansion"
      lore: |-
        &7The next Territory Flag placed within 60 seconds
        &7will be explicitly assigned to this territory
    disband-confirm:
      name: "&cConfirm Permanent Disband"
      lore: |-
        &7Release all chunks and remove member permissions
        &cClick to execute immediately
  butcher:
    labels:
      weapon:
        name: "&eWeapons (row below)"
        lore: |-
          &7Insert up to 7 weapons
          &7First weapon has priority; switches when durability reaches zero
      enchantment-book:
        name: "&dEnchanted Book ->"
        lore: |-
          &7Insert an enchanted book
          &7Looting / Sharpness / Fire Aspect apply
      food:
        name: "&6Food ->"
        lore: |-
          &7Insert food
          &7Each 1 nutrition = 15 attacks
          &7Internal maximum = 100 nutrition
      range-upgrade:
        name: "&bRange Upgrade ->"
        lore: |-
          &7Stack size = level (maximum 5)
          &7Each level: attack width/height +2, depth +1
      damage-upgrade:
        name: "&cDamage Upgrade ->"
        lore: |-
          &7Stack size = level (maximum 5)
          &7Each level adds +50% base damage
    info-template:
      name: "&cButcher Machine"
      lore: |-
        &7Automatically attacks non-player mobs in front of the machine.

        &7Right-click to insert weapons / enchanted books / food / upgrades.
        &7Food can also be supplied by hoppers or Cargo.
    info:
      name: "&cButcher Machine"
      lore: |-
        &7Current weapon: &f{weapon}
        &7Stored nutrition: &f{satiety}&7/&f{maxSatiety} &7(&f{attacks} attacks&7)
        &7Attack area: &f{span}x{span} &7(Range level &f{rangeLevel}&7)
        &7Damage multiplier: &fx{damageMultiplier} &7(Damage level &f{damageLevel}&7)

        &7Weapons: up to 7 in the row below
        &7Enchanted book: Looting / Sharpness / Fire Aspect
        &7Food: 15 attacks per nutrition point
        &7Upgrade slots: Range / Damage (maximum level 5)
        &7All items support hoppers or Cargo input
  auto-clicker:
    held-item:
      name: "&bHeld Item ↓"
      lore: |-
        &7Item held by the fake player while clicking
        &7(e.g. bone meal / bucket / seeds; hopper refill supported)
    upgrade-title: "&9Clicker Upgrades"
    interval:
      decrease:
        name: "&c- Decrease Interval"
        lore: |-
          &7Click: -{coarseStep} tick
          &7Shift-click: -{fineStep} tick
      info:
        name: "&eClick Interval: &f{interval} tick"
        lore: |-
          &7About &f{seconds} &7seconds per click
          &7Intervals below 1 tick perform multiple clicks per tick
          &7Range: {min}-{max}
      increase:
        name: "&a+ Increase Interval"
        lore: |-
          &7Click: +{coarseStep} tick
          &7Shift-click: +{fineStep} tick
    toggle:
      enabled:
        name: "&a{mode}: Enabled"
        lore: |-
          &7Click to disable
      disabled:
        name: "&7{mode}: Disabled"
        lore: |-
          &7Click to enable
  quarry:
    labels:
      efficiency-upgrade:
        name: "&eEfficiency Upgrade ->"
        lore: |-
          &7Insert &fQuarry Efficiency Upgrade I-V&7.
          &7Actual output depends on server configuration;
          &7the current rate is shown in the status panel above.
      output-upgrade:
        name: "&6Output Upgrade ->"
        lore: |-
          &7Insert a &cNetherrack&7, &eEnd Stone&7, or &8Blackstone Upgrade&7.
          &7An empty slot produces &fcobblestone&7.
    rate:
      upgraded: "&f{amount} &7items/0.5s (Efficiency &f{tier}&7)"
      base: "&f{amount} &7items/{ticks} tick (no upgrade)"
    status:
      no-cobblestone: "&cNo cobblestone in front"
      missing-fluids: "&cCobblestone is not adjacent to both lava and water"
      running: "&aRunning"
    info:
      name: "&bQuarry"
      lore: |-
        &7Status: {status}
        &7Rate: {rate}
        &7Output: &f{output}

        &7The &fcobblestone in front &7must touch both &clava &7and &9water&7.
        &7When valid, the Quarry continuously generates material without
        &7breaking the cobblestone. Output is sent to nearby containers.
    info-template:
      name: "&bQuarry"
      lore: |-
        &7Point the observer face at &fcobblestone &7that touches both
        &clava &7and &9water&7 to generate material.
        &7Output upgrades can change the result from cobblestone to
        &cnetherrack&7, &eend stone&7, or &8blackstone&7.
        &7Products are sent to nearby containers / drawers / paged boxes.
  paged-box:
    title: "&9Paged Storage Box"
    page:
      name: "&ePage {page}/{pages}"
      lore: []
    upgrade-title: "&9Storage Box Upgrades"
  disk-manager:
