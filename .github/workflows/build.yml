name: Build SlimeEasy

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "1.0.3"
  OUTPUT_NAME: "SF_SlimeEasy1.0.3.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_SlimeEasy${VERSION}.jar"
          test "$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')" = "$VERSION"
          grep -Fq 'archiveFileName.set("SF_SlimeEasy${project.version}.jar")' build.gradle.kts
      - name: Build plugin JAR
        run: ./gradlew build --no-daemon --stacktrace
      - name: Verify canonical raw release JAR
        id: plugin_jar
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JAR="build/libs/${OUTPUT_NAME}"
          test -s "$RELEASE_JAR"
          PLUGIN_VERSION=$(unzip -p "$RELEASE_JAR" paper-plugin.yml | awk -F': *' '/^version:/ {gsub(/["'"'"']/,"",$2); print $2; exit}')
          test "$PLUGIN_VERSION" = "$VERSION"
          if printf '%s\n' "$PLUGIN_VERSION" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
          echo "path=${RELEASE_JAR}" >> "$GITHUB_OUTPUT"
      - name: Runtime smoke on Paper 26.2
        shell: bash
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/slimeeasy-paper-26.2"
          mkdir -p "$SMOKE/plugins"
          cp "build/libs/$OUTPUT_NAME" "$SMOKE/plugins/$OUTPUT_NAME"
          curl -fL --retry 3 \
            -o "$SMOKE/plugins/Slimefun-Legacy4.1.53.jar" \
            https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.53/Slimefun-Legacy4.1.53.jar
          PAPER_URL="$(curl -fsSL --retry 3 \
            -H 'User-Agent: SF_SlimeEasy-CI/1.0.3' \
            https://fill.papermc.io/v3/projects/paper/versions/26.2/builds \
            | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty')"
          test -n "$PAPER_URL"
          curl -fL --retry 3 -H 'User-Agent: SF_SlimeEasy-CI/1.0.3' "$PAPER_URL" -o "$SMOKE/paper.jar"
          printf 'eula=true\n' > "$SMOKE/eula.txt"
          cat > "$SMOKE/server.properties" <<'EOF'
          online-mode=false
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          EOF
          (
            cd "$SMOKE"
            timeout 150s java -Xms512M -Xmx1024M -jar paper.jar --nogui > server.log 2>&1 &
            echo $! > server.pid
          )
          PID="$(cat "$SMOKE/server.pid")"
          for _ in $(seq 1 120); do
            if grep -Fq 'Done (' "$SMOKE/server.log"; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$SMOKE/server.log"
              exit 1
            fi
            sleep 1
          done
          grep -Fq 'Done (' "$SMOKE/server.log"
          grep -Fq 'Successfully running SlimeEasy!' "$SMOKE/server.log"
          if grep -Eq 'InvalidPluginException|NoClassDefFoundError|AbstractMethodError|Error occurred while enabling SlimeEasy' "$SMOKE/server.log"; then
            cat "$SMOKE/server.log"
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

      - name: Upload canonical plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: ${{ steps.plugin_jar.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA::7}"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${{ steps.plugin_jar.outputs.path }}" --title "SlimeEasy ${VERSION} (latest)" --notes "Automatically built from commit \`${SHA_SHORT}\`. Raw installable JAR: \`${OUTPUT_NAME}\`." --prerelease --target "${GITHUB_SHA}"
      - name: Publish stable version release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES_FILE="release-notes/${VERSION}.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r OLD; do
              if [[ "$OLD" == *.jar && "$OLD" != "$OUTPUT_NAME" ]]; then gh release delete-asset "$TAG" "$OLD" --repo "$GITHUB_REPOSITORY" -y; fi
            done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$TAG" "${{ steps.plugin_jar.outputs.path }}" --repo "$GITHUB_REPOSITORY" --clobber
          elif [[ -f "$NOTES_FILE" ]]; then
            gh release create "$TAG" "${{ steps.plugin_jar.outputs.path }}" --repo "$GITHUB_REPOSITORY" --title "SlimeEasy ${VERSION}" --notes-file "$NOTES_FILE" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "${{ steps.plugin_jar.outputs.path }}" --repo "$GITHUB_REPOSITORY" --title "SlimeEasy ${VERSION}" --notes "SlimeEasy ${VERSION}. Raw installable JAR: \`${OUTPUT_NAME}\`." --target "$GITHUB_SHA"
          fi
