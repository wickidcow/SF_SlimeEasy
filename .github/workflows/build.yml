name: Build

# Build the plugin on every push and manual dispatch.
# Successful pushes to main also publish the rolling `latest` prerelease.
on:
  push:
  workflow_dispatch:

# Release publishing requires repository content write permission.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build plugin JAR
        run: ./gradlew build --no-daemon --stacktrace

      - name: Locate primary plugin JAR
        id: plugin_jar
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_VERSION="$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')"
          PLUGIN_JAR="build/libs/SlimeEasy-${PLUGIN_VERSION}.jar"
          # Publish only the unclassified primary artifact so future sources/dev
          # JARs cannot accidentally be treated as installable server plugins.
          test -n "${PLUGIN_VERSION}"
          test -f "${PLUGIN_JAR}"
          echo "path=${PLUGIN_JAR}" >> "${GITHUB_OUTPUT}"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          # Include the short commit identity in the artifact name for easy comparison.
          name: SlimeEasy-${{ github.sha }}
          # Kotlin is provided at runtime through Paper's plugin loader.
          path: ${{ steps.plugin_jar.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      # Only successful main-branch builds update the rolling release.
      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA::7}"
          # Recreate the latest release/tag at the current main commit.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${{ steps.plugin_jar.outputs.path }}" \
            --title "Development Build (latest)" \
            --notes "Automatically built from commit \`${SHA_SHORT}\`. This prerelease follows the latest successful main-branch build." \
            --prerelease \
            --target "${GITHUB_SHA}"
