name: Build SlimeEasy

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_new_release:
        description: 'Publish a distinct version only after all cargo tests and exact-source checks pass'
        required: true
        type: boolean
        default: false
      confirm_version:
        description: 'Confirm the exact reviewed new version'
        required: false
        type: string
        default: ''
      expected_source_sha:
        description: 'Reviewed 40-character source SHA, matching current main'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  VERSION: "1.0.5"
  OUTPUT_NAME: "SF_SlimeEasy1.0.5.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Verify immutable release contract and no-clobber regression
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/publish_new_release.sh
          python3 -m unittest discover -s scripts -p 'test_publish_new_release.py' -v
      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_SlimeEasy${VERSION}.jar"
          test "$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')" = "$VERSION"
          grep -Fq 'archiveFileName.set("SF_SlimeEasy${project.version}.jar")' build.gradle.kts
      - name: Verify guide category localization isolation
        shell: bash
        run: |
          set -euo pipefail
          GROUPS_FILE="src/main/kotlin/top/maplex/slimeEasy/registry/Groups.kt"
          grep -Fq 'SEText.localizedIcon(' "$GROUPS_FILE"
          if grep -Fq 'SlimefunItemStack' "$GROUPS_FILE"; then
            echo "SlimeEasy guide category icons must remain plain ItemStacks so translation hooks cannot override the configured locale." >&2
            exit 1
          fi
      - name: Build plugin JAR
        run: ./gradlew build cargoRegressionJar --no-daemon --stacktrace
      - name: Verify canonical raw release JAR
        id: plugin_jar
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JAR="build/libs/${OUTPUT_NAME}"
          test -s "$RELEASE_JAR"
          PLUGIN_VERSION=$(unzip -p "$RELEASE_JAR" paper-plugin.yml | awk -F': *' '/^version:/ {gsub(/["'"'"']/,"",$2); print $2; exit}')
          test "$PLUGIN_VERSION" = "$VERSION"
          if printf '%s\n' "$PLUGIN_VERSION" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
          echo "path=${RELEASE_JAR}" >> "$GITHUB_OUTPUT"
      - name: Cargo wrapper regression on Paper 26.2
        run: bash scripts/smoke-cargo-regression.sh 26.2
      - name: Cargo wrapper regression on Paper 26.3
        run: bash scripts/smoke-cargo-regression.sh 26.3

      - name: Verify universal Java 21 plugin bytecode and packaged identity
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/$OUTPUT_NAME"
          unzip -tqq "$JAR"
          python3 - <<'PY'
          import struct, zipfile
          path = 'build/libs/SF_SlimeEasy1.0.5.jar'
          with zipfile.ZipFile(path) as zipfile_obj:
              names = [n for n in zipfile_obj.namelist() if n.endswith('.class')]
              if not names:
                  raise SystemExit('No JVM classes in SlimeEasy release JAR')
              majors = set()
              for name in names:
                  data = zipfile_obj.read(name)[:8]
                  if data[:4] != bytes.fromhex('cafebabe'):
                      raise SystemExit('Invalid JVM class header: ' + name)
                  majors.add(struct.unpack('>H', data[6:8])[0])
              if 65 not in majors or any(major > 65 for major in majors):
                  raise SystemExit('SlimeEasy distributable must preserve Java 21 bytecode')
          print('Java 21 raw JAR bytecode verified')
          PY
      - name: Upload canonical plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: ${{ steps.plugin_jar.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 90


  publish:
    name: Publish a distinct SlimeEasy version after manual opt-in
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_new_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exactly reviewed source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download same-run raw canonical JAR
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist
          skip-decompress: true
      - name: Validate reviewed exact source, immutable tag and canonical JAR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONFIRMED: ${{ inputs.publish_new_release }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          JAR: dist/SF_SlimeEasy1.0.5.jar
        run: bash scripts/publish_new_release.sh
      - name: Verify published SHA, asset checksum and byte-identical redownload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > "$RUNNER_TEMP/slimeeasy-release.json"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          release = json.loads((Path(os.environ['RUNNER_TEMP'])/'slimeeasy-release.json').read_text(encoding='utf-8'))
          jar = Path('dist')/os.environ['OUTPUT_NAME']
          assert release['tag_name'] == 'v'+os.environ['VERSION']
          assert release['target_commitish'] == os.environ['GITHUB_SHA']
          assert len(release['assets']) == 1
          asset = release['assets'][0]
          assert asset['name'] == jar.name and asset['size'] == jar.stat().st_size
          assert asset['state'] == 'uploaded'
          assert asset['digest'] == 'sha256:'+hashlib.sha256(jar.read_bytes()).hexdigest()
          PY
          mkdir -p verified
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$OUTPUT_NAME" --dir verified
          cmp "dist/$OUTPUT_NAME" "verified/$OUTPUT_NAME"
