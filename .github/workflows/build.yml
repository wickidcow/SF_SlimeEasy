name: Build

# Build the plugin on every push and manual dispatch.
# Successful main builds publish the rolling `latest` prerelease and, for
# non-SNAPSHOT versions, a stable versioned release if one does not exist.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build plugin JAR
        run: ./gradlew build --no-daemon --stacktrace

      - name: Prepare raw release JAR
        id: plugin_jar
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_VERSION="$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')"
          BUILT_JAR="build/libs/SlimeEasy-${PLUGIN_VERSION}.jar"
          RELEASE_NAME="SF_SlimeEasy${PLUGIN_VERSION}.jar"
          RELEASE_JAR="build/libs/${RELEASE_NAME}"

          test -n "${PLUGIN_VERSION}"
          test -f "${BUILT_JAR}"
          cp "${BUILT_JAR}" "${RELEASE_JAR}"

          echo "version=${PLUGIN_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "name=${RELEASE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "path=${RELEASE_JAR}" >> "${GITHUB_OUTPUT}"

      - name: Upload raw plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: SF_SlimeEasy${{ steps.plugin_jar.outputs.version }}
          path: ${{ steps.plugin_jar.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA::7}"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${{ steps.plugin_jar.outputs.path }}" \
            --title "SlimeEasy Legacy ${{ steps.plugin_jar.outputs.version }} (latest)" \
            --notes "Automatically built from commit \`${SHA_SHORT}\`. Raw installable JAR: \`${{ steps.plugin_jar.outputs.name }}\`." \
            --prerelease \
            --target "${GITHUB_SHA}"

      - name: Publish stable version release
        if: github.ref == 'refs/heads/main' && !contains(steps.plugin_jar.outputs.version, 'SNAPSHOT')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.plugin_jar.outputs.version }}"
          TAG="v${VERSION}"
          NOTES_FILE="release-notes/${VERSION}.md"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it unchanged."
            exit 0
          fi

          if [[ -f "${NOTES_FILE}" ]]; then
            gh release create "${TAG}" "${{ steps.plugin_jar.outputs.path }}" \
              --title "SlimeEasy Legacy ${VERSION}" \
              --notes-file "${NOTES_FILE}" \
              --target "${GITHUB_SHA}"
          else
            gh release create "${TAG}" "${{ steps.plugin_jar.outputs.path }}" \
              --title "SlimeEasy Legacy ${VERSION}" \
              --notes "SlimeEasy Legacy ${VERSION}. Raw installable JAR: \`${{ steps.plugin_jar.outputs.name }}\`." \
              --target "${GITHUB_SHA}"
          fi
